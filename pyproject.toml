[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-forge"
version = "1.0.0"
description = "Turn a verified finding into a clean, submission-ready vulnerability report with accurate CVSS 3.1 scoring and a pre-submit secret/completeness lint."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jakub Kozub" }]
keywords = [
    "security",
    "bug-bounty",
    "vulnerability",
    "cvss",
    "cvss3.1",
    "report",
    "hackerone",
    "bugcrowd",
    "triage",
    "appsec",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jakubkozub/finding-forge"
Source = "https://github.com/jakubkozub/finding-forge"
Issues = "https://github.com/jakubkozub/finding-forge/issues"

[project.scripts]
finding-forge = "finding_forge.cli:main"

[tool.setuptools]
packages = ["finding_forge"]

[tool.setuptools.package-data]
finding_forge = ["py.typed"]
